target:
  checks:
    ears:
      run: bun .maestro/triage/ears.ts
      timeout: 1m
      hint: the EARS shape of each requirement in your plan; pipe the plan's JSON in on standard input, e.g. `check ears <<'EOF'` then the plan, then `EOF`
profiles:
  triager: { runtime: { harness: claude, model: claude-sonnet-5-5, thinking: medium } }
  classics/scout: { runtime: { harness: claude, model: claude-haiku-5-5, thinking: medium } }
  classics/scout-deep: { runtime: { harness: claude, model: claude-sonnet-5-5, thinking: high } }
  designer: { runtime: { harness: claude, model: claude-sonnet-5-5, thinking: medium } }
  classics/planner: { runtime: { harness: claude, model: claude-opus-5-5, thinking: high } }
  checker: { runtime: !replace { harness: pi, model: github-copilot/gpt-6.1-terra, thinking: medium } }
