target:
  repo: .
  base: main
  # bun and just come from the tool PATH the user config's `sandbox.path` sets, as their install paths are machine-specific.
  prepare:
    run: bun install --frozen-lockfile
    cache: { path: ~/.bun/install/cache, at: /cache, env: BUN_INSTALL_CACHE_DIR }
  checks:
    all:
      run: just check
      hint: format, lint, types and every test
profiles:
  classics/builder:
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before drawing any Mermaid diagram: SKILL.md" }
  classics/lens:
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
  writer:
    attachments:
      writing: { path: packs/classics/profiles/builder/writing, hint: "before writing the body: writing.md" }
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before drawing any Mermaid diagram: SKILL.md" }
