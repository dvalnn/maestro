target:
  repo: .
  base: main
  # bun and just come from the tool PATH the user config's `sandbox.path` sets, as their install paths are machine-specific.
  prepare:
    run: bun install --frozen-lockfile
    cache: { path: ~/.bun/install/cache, at: /cache, env: BUN_INSTALL_CACHE_DIR }
  checks:
    lint:
      run: just lint
      hint: rewrites code files with biome's safe lint fixes and import sorting, then checks the domain words, prompt imports, the Plain English sentence and paragraph limits of Markdown prose and that no git conflict marker is left
    types:
      run: just types
      hint: tsc typecheck
    test:
      run: just test
      hint: every bun test, including .maestro; `just test <path>…` runs only those files, under bun
    fmt:
      run: just fmt
      hint: rewrites code files with biome's formatter and Markdown files with prettier
classics:
  build: { checks: [lint, types, test] }
  test_first: { checks: [lint, types, test] }
  fix_until_clean: { checks: [lint, types, test] }
  tiered_review: { checks: [lint, types, test] }
  repair_until_green: { fix: fmt }
profiles:
  classics/builder:
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before drawing any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before adding to or editing any doc: each topic's home and the doc conventions" }
  classics/lens:
    runtime: { harness: claude, model: claude-haiku-5-5, thinking: medium }
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
