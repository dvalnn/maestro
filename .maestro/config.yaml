target:
  repo: .
  base: main
  # bun and just come from the tool PATH the user config's `sandbox.path` sets, as their install paths are machine-specific.
  prepare:
    run: bun install --frozen-lockfile
    cache: { path: ~/.bun/install/cache, at: /cache, env: BUN_INSTALL_CACHE_DIR }
  checks:
    format:
      run: just format
      hint: biome and prettier format checks; fix with just fmt
    lint:
      run: just lint
      hint: the domain words script
    types:
      run: just types
      hint: tsc typecheck
    test:
      run: just test
      hint: every bun test, including .maestro
    all:
      run: just check
      hint: format, lint, types and every test, stopping at the first failure, so run the granular checks first
    fmt:
      run: just fmt
      hint: rewrites files with biome and prettier; run before the format check
classics:
  build: { checks: [lint, types, test, all] }
  test_first: { checks: [lint, types, test, all] }
  fix_until_clean: { checks: [lint, types, test, all] }
  tiered_review: { checks: [lint, types, test, all] }
  repair_until_green: { fix: fmt }
profiles:
  classics/builder:
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before drawing any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before adding to or editing any doc: each topic's home and the doc conventions" }
  classics/lens:
    runtime: { harness: claude, model: claude-haiku-5-5, thinking: medium }
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before judging any doc: each topic's home and the doc conventions" }
  classics/deep-lens:
    runtime: { harness: claude, model: claude-sonnet-5-5, thinking: medium }
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before judging any doc: each topic's home and the doc conventions" }
  classics/top-lens:
    runtime: { harness: claude, model: claude-opus-5-5, thinking: medium }
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before judging any doc: each topic's home and the doc conventions" }
  classics/cross-lens:
    runtime: { harness: pi, model: github-copilot/gpt-6.1-sol, thinking: medium }
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before judging any Mermaid diagram: SKILL.md" }
      docs: { path: docs/README.md, hint: "before judging any doc: each topic's home and the doc conventions" }
  writer:
    attachments:
      diagrams: { path: .claude/skills/forge-diagrams, hint: "before drawing any Mermaid diagram: SKILL.md" }
  classics/tester:
    runtime: { harness: pi, model: github-copilot/gpt-6.1-terra, thinking: medium }
