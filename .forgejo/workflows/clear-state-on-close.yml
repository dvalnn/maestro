name: clear-state-on-close

on:
  issues:
    types: [closed]

jobs:
  clear:
    runs-on: docker
    steps:
      - name: Drop every state label but wontfix
        run: |
          api=${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          auth="Authorization: token ${{ github.token }}"
          curl -fsS -H "$auth" "$api/labels" |
            jq -r '.[] | select(.name | startswith("state/") and . != "state/wontfix") | .id' |
            while read -r id; do curl -fsS -X DELETE -H "$auth" "$api/labels/$id"; done
